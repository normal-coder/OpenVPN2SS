services:
  openvpn:
    container_name: ${CONTAINER_NAME:-openvpn-client}
    image: ${IMAGE_NAME:-normalcoder/openvpn2ss:v2.0.0}
    privileged: true
    devices:
      - "/dev/net/tun:/dev/net/tun"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${SS_PORT:-5162}:5162"
    environment:
      - SS_PASSWORD=${SS_PASSWORD:-}
      - SS_METHOD=${SS_METHOD:-aes-256-gcm}
      - VPN_PASSWORD=${VPN_PASSWORD:-}
      - VPN_USERNAME=${VPN_USERNAME:-}
      - VPN_READY_TIMEOUT=${VPN_READY_TIMEOUT:-60}
      - ENABLE_DNSMASQ=${ENABLE_DNSMASQ:-true}
      - DNS_SERVERS=${DNS_SERVERS:-}
      - DNS_FALLBACK=${DNS_FALLBACK:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5162 && pgrep openvpn >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 70s
    volumes:
      - ${OVPN_CONFIG_DIR:-./config/openvpn}:/etc/openvpn-config
      - ${DNS_CONFIG_DIR:-./config/dnsmasq.d}:/etc/dnsmasq.d:ro
      - ${LOG_DIR:-./logs}:/var/log/custom
