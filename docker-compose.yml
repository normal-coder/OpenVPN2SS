version: "3"
services:
  openvpn-client:
    container_name: openvpn-client
    image: normalcoder/openvpn2ss:latest
    privileged: true
    dns:
      - 10.8.0.1
    devices:
      - "/dev/net/tun:/dev/net/tun"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5162:5162"
    environment:
      # Set your Shadowsocks password here or via: export SS_PASSWORD=your_password
      - SS_PASSWORD=${SS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "5162"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 70s
    volumes:
      - ./config/openvpn:/etc/openvpn-config
      - ./config/shadowsocks/shadowsocks.json:/etc/shadowsocks.json
      - ./logs:/var/log/custom
