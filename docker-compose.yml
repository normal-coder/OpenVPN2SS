services:
  openvpn-client:
    container_name: ${CONTAINER_NAME:-openvpn-client}
    image: normalcoder/openvpn2ss:latest
    privileged: true
    devices:
      - "/dev/net/tun:/dev/net/tun"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${SS_PORT:-5162}:5162"
    environment:
      - SS_PASSWORD=${SS_PASSWORD:-}
      - VPN_READY_TIMEOUT=${VPN_READY_TIMEOUT:-60}
      - ENABLE_DNSMASQ=${ENABLE_DNSMASQ:-true}
      - DNS_SERVERS=${DNS_SERVERS:-}
      - DNS_FALLBACK=${DNS_FALLBACK:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5162 && pgrep openvpn >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 70s
    volumes:
      - ./config/openvpn:/etc/openvpn-config
      - ./config/shadowsocks/shadowsocks.json:/etc/shadowsocks.json:ro
      - ./config/dnsmasq.d:/etc/dnsmasq.d:ro
      - ./logs:/var/log/custom
